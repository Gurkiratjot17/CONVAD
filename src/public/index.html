<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONVAD</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="shell">
      <!-- Sidebar (optional like ChatGPT) -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="logo">ＣＯＮＶＡＤ</div>
          <button id="newChatBtn" class="btn btn-ghost">+ New chat</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Chats</div>
          <div id="chatList" class="chat-list">
            <div class="chat-item chat-item-active">
              <span class="chat-dot"></span>
              <span class="chat-name">Current conversation</span>
            </div>
          </div>
        </div>

        <div class="sidebar-bottom">
          <div class="statusline">
            <span id="healthDot" class="dot"></span>
            <span id="healthText">Checking backend…</span>
          </div>
          <div class="small muted">API: <code>/conversations</code></div>
        </div>
      </aside>

      <!-- Main chat area -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <div class="model-pill">CONVAD</div>
            <div class="muted">Chat-style UI</div>
          </div>
          <div class="topbar-right">
            <span class="pill">
              Conversation: <code id="conversationId">none</code>
            </span>
          </div>
        </header>

        <section class="chat">
          <div id="messages" class="messages">
            <div class="empty">
              <h2>How can CONVAD help?</h2>
              <p>Send a message to start the conversation.</p>
            </div>
          </div>

          <div class="composer">
            <form id="chatForm" class="composer-form">
              <div class="composer-box">
                <textarea
                  id="messageInput"
                  rows="1"
                  placeholder="Message CONVAD…"
                ></textarea>

                <button id="sendBtn" type="submit" class="send" aria-label="Send">
                  ↑
                </button>
              </div>

              <div id="errorBox" class="error hidden"></div>

              <div class="composer-hint muted">
                Tip: Press <strong>Enter</strong> to send • <strong>Shift+Enter</strong> for a new line
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
