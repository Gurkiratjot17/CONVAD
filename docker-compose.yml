services:
  db:
    image: mysql:8.0
    container_name: convad-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT} 
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - convad_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: convad-phpmyadmin
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=${DB_HOST}
      - PMA_PORT=${DB_PORT}
      - PMA_USER=${DB_USER}
      - PMA_PASSWORD=${DB_PASSWORD}

  web:
    build: .
    container_name: convad-web
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app/
      - /usr/src/app/node_modules
    environment:
      - DEBUG_KEYWORDS=${DEBUG_KEYWORDS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}

      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      - OTP_PEPPER=${OTP_PEPPER}
      - OTP_TTL_MINUTES=${OTP_TTL_MINUTES}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS}
      - OTP_LOCK_MINUTES=${OTP_LOCK_MINUTES}

      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
    depends_on:
      - db
    command: npm run dev

volumes:
  convad_mysql_data:
