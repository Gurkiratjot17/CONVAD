<!doctype html>
<html>
<head>
  <!-- Defines character encoding to ensure correct rendering across browsers -->
  <meta charset="utf-8" />

  <!-- Enables responsive design for mobile and desktop devices -->
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Page title shown in browser tab -->
  <title>Register — CONVAD</title>

   <!-- Global stylesheet for consistent UI styling -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

   <!-- Theme toggle button (reuses shared logic in app.js for light/dark mode) -->
  <button 
  id="themeBtn" 
  class="btn secondary" 
  type="button" 
  aria-label="Toggle theme"
  style="position:fixed; top:16px; right:16px; z-index:1000;"
>
  🌙
</button>

  <!-- Wrapper used across authentication pages for layout consistency -->
  <div class="auth-wrap">
     <!-- Branding: visual identity placed above the form for recognition -->
    <div class="auth-logo">
      <img src="/assets/CONVAD.png" alt="CONVAD logo" />
    </div>

    <!-- Main registration card -->
    <div class="auth-card">
      
      <!-- Section title -->
      <h2>Create account</h2>

      <!-- User identity inputs (non-required but useful for personalization) -->
      <input id="firstName" placeholder="First name" />
      <input id="lastName" placeholder="Last name" />

      <!-- Email input (required field for authentication and communication) -->
      <input
        id="email"
        type="email"
        placeholder="Email"
        required
      />

      <!-- Password input with visibility toggle (UX + accessibility consideration) -->
      <div class="password-field">
        <input
          id="password"
          type="password"
          placeholder="Password (8+ chars: upper, lower, number, symbol)"
          minlength="8"
          required
        />
        <button
          type="button"
          id="togglePassword"
          class="toggle-password"
          aria-label="Show password"
          title="Show password"
        >👁️</button>
      </div>
 
      <!-- Confirm password input to reduce user error -->
      <div class="password-field">
        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm password"
          required
        />
        <button
          type="button"
          id="toggleConfirmPassword"
          class="toggle-password"
          aria-label="Show password"
          title="Show password"
        >👁️</button>
      </div>

      <!-- Terms acceptance (critical for legal compliance and ethical transparency) -->
      <div class="terms-row">
        <label class="terms" for="acceptTerms">
          <input id="acceptTerms" type="checkbox" />
          <span>I agree to the</span>
        </label>

        <!-- External link ensures users can review terms before consenting -->
        <a class="terms-link" href="/terms.html" target="_blank" rel="noopener">
          Terms &amp; Conditions
        </a>
      </div>


      <!-- Submit button for registration -->
      <button
        id="registerBtn"
        type="button"
        class="btn primary"
      >
        Register
      </button>

      <!-- Navigation for existing users -->
      <p class="auth-meta">
        Already have an account?
        <a href="/login.html">Login</a>
      </p>

      <!-- Feedback container for validation and server responses -->
      <div id="msg" class="auth-msg"></div>
    </div>
  </div>

  <script>
    // Cache DOM references for performance and readability
    const msg = document.getElementById("msg");
    const registerBtn = document.getElementById("registerBtn");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const acceptTermsEl = document.getElementById("acceptTerms");

    // ----------------------------
    // Show / Hide password toggles
    // ----------------------------
    document.getElementById("togglePassword").addEventListener("click", (e) => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
      // Dynamically update icon and accessibility labels based on state
      e.target.textContent = hidden ? "🙈" : "👁️";
      e.target.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
      e.target.title = hidden ? "Hide password" : "Show password";
    });

    document.getElementById("toggleConfirmPassword").addEventListener("click", (e) => {
      const hidden = confirmInput.type === "password";
      confirmInput.type = hidden ? "text" : "password";
      e.target.textContent = hidden ? "🙈" : "👁️";
      e.target.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
      e.target.title = hidden ? "Hide password" : "Show password";
    });

    // ----------------------------
    // Validation helpers
    // Client-side validation improves UX but must not replace server validation
    // ----------------------------

    // Basic email validation using regex (not exhaustive but practical)
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    }

    // Enforces password complexity for basic security standards
    function isStrongPassword(pw) {
      return (
        pw.length >= 8 &&
        /[A-Z]/.test(pw) &&
        /[a-z]/.test(pw) &&
        /[0-9]/.test(pw) &&
        /[^A-Za-z0-9]/.test(pw)
      );
    }

    // ----------------------------
    // Register submit
    // ----------------------------
    registerBtn.addEventListener("click", async () => {
      msg.textContent = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      // Email validation
      if (!isValidEmail(email)) {
        msg.textContent = "Please enter a valid email address.";
        return;
      }

      // Password strength enforcement
      if (!isStrongPassword(password)) {
        msg.textContent =
          "Password must be at least 8 characters and include uppercase, lowercase, number, and symbol.";
        return;
      }

      // Ensure password confirmation matches to reduce user errors
      if (password !== confirmPassword) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      // Explicit consent check (critical for legal/ethical compliance)
      const acceptTerms = document.getElementById("acceptTerms")?.checked === true;

      if (!acceptTerms) {
        msg.textContent = "You must accept the Terms & Conditions to register.";
        return;
      }

      // Prepare request payload with all necessary fields for registration
      const body = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email,
        password,
        acceptTerms
      };

      try {
        // Send registration request to backend
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        // Handle response parsing safely
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(`Server returned ${res.status}`);
        }

        // Handle API error responses gracefully
        if (!data.ok) {
          msg.textContent = data.error || "Registration failed";
          return;
        }

        // Store temporary registration state for OTP verification step
        localStorage.setItem("convad_pending_id", String(data.pendingId));
        localStorage.setItem("convad_pending_email", email);

        // Redirect user to OTP verification page
        window.location.href = "/verify-otp.html";
      } catch (err) {
        console.error(err);
        msg.textContent = err.message || "Registration failed (server error)";
      }
    });
  </script>
   <!-- Shared application script (handles theme + global behaviors) -->
    <script src="/app.js" defer></script>
</body>
</html>
