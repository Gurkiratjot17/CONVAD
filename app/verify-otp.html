<!doctype html>
<html>
<head>
  <!-- Character encoding for correct text rendering -->
  <meta charset="utf-8" />
   <!-- Responsive layout for mobile and desktop screens -->
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verify OTP — CONVAD</title>

  <!-- Global stylesheet shared across the application -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- Authentication page wrapper -->
  <div class="auth-wrap">
    <!-- Branding shown above the verification card -->
    <div class="auth-logo">
      <img src="/assets/CONVAD.png" alt="CONVAD logo" />
    </div>

    <!-- OTP verification card -->
    <div class="auth-card">
      <h2>Verify your email</h2>

      <!-- Dynamic hint showing where the OTP was sent -->
      <p class="auth-meta" id="hint"></p>

      <!-- OTP input optimised for numeric entry on mobile devices -->
      <input id="otp" placeholder="Enter 6-digit code" inputmode="numeric" />
      <button id="verifyBtn" class="btn primary">Verify</button>

      <!-- Resend line (keeps layout the same: just another meta line) -->
      <p class="auth-meta" style="margin-top:10px;">
        Didn’t get a code?
        <button id="resendBtn" type="button" class="link-btn">Resend</button>
        <span id="resendStatus" style="margin-left:8px;"></span>
      </p>

      <!-- Recovery path if user registered with the wrong email -->
      <p class="auth-meta">
        Wrong email? <a href="/register.html">Start again</a>
      </p>

      <!-- Runtime feedback/error message container -->
      <div id="msg" class="auth-msg"></div>
    </div>
  </div>

  <script>
    // Cache DOM elements used by the OTP page
    const msg = document.getElementById("msg");
    const verifyBtn = document.getElementById("verifyBtn");
    const hint = document.getElementById("hint");

    const resendBtn = document.getElementById("resendBtn");
    const resendStatus = document.getElementById("resendStatus");

    // Retrieve pending registration state created during registration
    const pendingId = localStorage.getItem("convad_pending_id");
    const pendingEmail = localStorage.getItem("convad_pending_email");

    // If no pending registration exists, redirect back to registration
    if (!pendingId) {
      window.location.href = "/register.html";
    }

    // Display user-friendly hint about where the verification code was sent
    hint.textContent = pendingEmail
      ? `We sent a code to ${pendingEmail}.`
      : "We sent a verification code to your email.";

    // Small helper so we don’t crash on non-JSON errors
    async function safeJson(res) {
      const text = await res.text().catch(() => "");
      try { return JSON.parse(text); }
      catch { return { ok: false, error: text || `Server returned ${res.status}` }; }
    }

    // Starts a UI-only cooldown after resend to reduce repeated clicks
    function setResendCooldown(seconds) {
      let remaining = seconds;
      resendBtn.disabled = true;

      const tick = () => {
        if (remaining <= 0) {
          resendBtn.disabled = false;
          resendStatus.textContent = "";
          return;
        }
        resendStatus.textContent = `(${remaining}s)`;
        remaining -= 1;
        window.setTimeout(tick, 1000);
      };
      tick();
    }

    // Verify OTP and complete account setup
    verifyBtn.addEventListener("click", async () => {
      msg.textContent = "";

      const otp = document.getElementById("otp").value.trim();
      // Basic client-side validation
      if (!otp) {
        msg.textContent = "Please enter the code.";
        return;
      }

      // Submit OTP to backend verification endpoint
      const res = await fetch("/api/auth/register/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pendingId: Number(pendingId), otp }),
      });

      const data = await safeJson(res);
      // Display backend validation errors
      if (!data.ok) {
        msg.textContent = data.error || "Verification failed";
        return;
      }

      // Store authenticated session token after successful verification
      localStorage.setItem("convad_token", data.token);

      // Clear temporary pending registration state
      localStorage.removeItem("convad_pending_id");
      localStorage.removeItem("convad_pending_email");

      // Redirect authenticated user to main chat application
      window.location.href = "/";
    });

    // Resend OTP
    resendBtn.addEventListener("click", async () => {
      msg.textContent = "";
      resendStatus.textContent = "";

      try {
         // Disable button while request is in progress
        resendBtn.disabled = true;
        resendStatus.textContent = "Sending...";

        // Request a new OTP for the existing pending registration
        const res = await fetch("/api/auth/register/resend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pendingId: Number(pendingId) }),
        });

        const data = await safeJson(res);
         // Handle resend failure and re-enable button
        if (!data.ok) {
          resendBtn.disabled = false;
          resendStatus.textContent = "";
          msg.textContent = data.error || "Resend failed";
          return;
        }

        // Confirm resend and begin client-side cooldown
        resendStatus.textContent = "Sent!";
        // simple anti-spam cooldown (UI only)
        setResendCooldown(30);
      } catch (e) {
        // Restore UI state after network/server failure
        resendBtn.disabled = false;
        resendStatus.textContent = "";
        msg.textContent = e?.message || "Resend failed (network/server error)";
      }
    });
  </script>

  
</body>
</html>
